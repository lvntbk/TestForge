services:
  postgres:
    image: postgres:16-alpine
    container_name: testforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: testforge
      POSTGRES_USER: testforge
      POSTGRES_PASSWORD: testforge_dev_password
    ports:
      - "5433:5432"
    volumes:
      - testforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U testforge -d testforge
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  testforge-postgres-data:
